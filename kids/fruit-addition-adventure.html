<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Addition Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#aee6ff;--bg2:#fff3c4;--card:#ffffff;--ink:#3a2a6e;--muted:#7a6fa8;--edge:#d9cffc;--ok:#2fbf62;--bad:#ff5a5f;--sun:#ffb703;--grape:#7b5cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1b4b;--bg2:#3b2a6b;--card:#2c2762;--ink:#fff7e0;--muted:#c7bdf5;--edge:#4a4296}}
:root[data-theme="dark"]{--bg1:#1d1b4b;--bg2:#3b2a6b;--card:#2c2762;--ink:#fff7e0;--muted:#c7bdf5;--edge:#4a4296}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:var(--bg1);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 40px;position:relative}
.screen{display:none}.screen.on{display:block}
svg.s{position:absolute;width:0;height:0}
/* animations */
@keyframes pop{0%{transform:scale(0) rotate(-12deg);opacity:0}70%{transform:scale(1.12) rotate(3deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px) scale(1.12)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d,0ms)}
/* hero */
.hero{text-align:center;padding-top:22px}
.fruitrow{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fruitrow svg{width:clamp(48px,10vw,78px);height:clamp(48px,10vw,78px);filter:drop-shadow(0 6px 4px rgba(60,30,90,.28));animation:float 3s ease-in-out infinite;animation-delay:var(--d)}
h1{margin:6px 0 10px;font-size:clamp(40px,9vw,78px);line-height:1;font-weight:700;letter-spacing:1px;color:#ff5a5f;text-shadow:0 2px 0 #d93b4a,0 4px 0 #c22d44,0 6px 0 #a82040,0 10px 14px rgba(40,10,60,.35)}
h1 .w{display:block}
h1 .l{display:inline-block;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
h1 .l:nth-child(3n){color:#ffb703;text-shadow:0 2px 0 #e08e00,0 4px 0 #c27400,0 6px 0 #a45e00,0 10px 14px rgba(40,10,60,.35)}
h1 .l:nth-child(3n+1){color:#3cc86b;text-shadow:0 2px 0 #26a352,0 4px 0 #1b8742,0 6px 0 #146d35,0 10px 14px rgba(40,10,60,.35)}
.sub{font-size:clamp(18px,3.6vw,26px);font-weight:600;max-width:560px;margin:0 auto 26px;color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:clamp(20px,4vw,28px);color:#fff;background:var(--grape);border:0;border-radius:999px;padding:14px 38px;cursor:pointer;box-shadow:0 8px 0 #4b32c4,0 14px 18px rgba(40,10,90,.3);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #4b32c4}
.btn.go{background:var(--ok);box-shadow:0 8px 0 #1c8f48,0 14px 18px rgba(10,70,30,.3)}
.btn.go:active{box-shadow:0 2px 0 #1c8f48}
.hint{margin-top:22px;color:var(--muted);font-weight:600}
/* game */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rf{font:inherit;color:var(--ink);border:0;cursor:pointer;transition:transform .1s,box-shadow .1s}
.rf:hover{transform:translateY(-2px)}
.rf:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.chip{background:var(--card);border-radius:999px;padding:6px 16px;font-weight:700;box-shadow:0 4px 0 var(--edge)}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--card);box-shadow:inset 0 -3px 0 var(--edge),0 2px 0 var(--edge);transition:.3s}
.dots i.cur{background:var(--sun);transform:scale(1.3);box-shadow:inset 0 -3px 0 #d98e00,0 3px 0 #d98e00}
.dots i.done{background:var(--ok);box-shadow:inset 0 -3px 0 #1c8f48,0 2px 0 #1c8f48}
.card{background:var(--card);border-radius:34px;padding:22px 14px 26px;box-shadow:0 10px 0 var(--edge),0 24px 30px rgba(40,20,90,.22);text-align:center;transform-origin:center bottom}
.qlabel{font-size:20px;font-weight:700;color:var(--muted);margin-bottom:4px}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin:10px 0}
.grp{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:340px;padding:8px;border-radius:24px;background:rgba(123,92,255,.09)}
.fruit{position:relative;width:clamp(48px,11vw,74px);height:clamp(48px,11vw,74px);border:0;padding:0;background:none;cursor:pointer;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
.fruit svg{width:100%;height:100%;filter:drop-shadow(0 5px 3px rgba(60,30,90,.3));transition:transform .15s}
.fruit:hover svg{transform:scale(1.1) rotate(-5deg)}
.fruit.hop{animation:hop .6s ease both;animation-delay:var(--d)}
.badge{position:absolute;right:-2px;top:-4px;min-width:26px;height:26px;border-radius:50%;background:var(--sun);color:#3a2a6e;font-size:16px;line-height:26px;font-weight:700;box-shadow:0 3px 0 #d98e00;transform:scale(0);transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.fruit.cnt .badge{transform:scale(1)}
.op{font-size:clamp(40px,9vw,64px);font-weight:700;color:var(--grape)}
.ans{width:clamp(72px,16vw,100px);height:clamp(72px,16vw,100px);border-radius:24px;border:4px dashed var(--grape);display:grid;place-items:center;font-size:clamp(40px,9vw,60px);font-weight:700;background:var(--card)}
.ans.ok{border:4px solid var(--ok);background:#d6f8e2;color:#16803d;animation:pop .5s both}
.ans.bad{border:4px solid var(--bad);background:#ffe0e1;color:#c2272d;animation:shake .5s}
.sum{font-size:clamp(34px,8vw,54px);font-weight:700;margin:4px 0 6px;letter-spacing:3px}
.msg{min-height:34px;font-size:clamp(18px,3.5vw,24px);font-weight:600;margin:4px 8px 12px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:460px;margin:0 auto}
.pad button{font:inherit;font-size:clamp(24px,6vw,34px);font-weight:700;color:#fff;border:0;border-radius:20px;aspect-ratio:1/0.92;cursor:pointer;background:hsl(var(--h) 85% 58%);box-shadow:0 6px 0 hsl(var(--h) 70% 38%);transition:transform .1s,box-shadow .1s;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
.pad button:active{transform:translateY(5px);box-shadow:0 1px 0 hsl(var(--h) 70% 38%)}
.pad button:disabled{filter:grayscale(1) opacity(.45);cursor:not-allowed;box-shadow:none;transform:translateY(5px)}
.next{margin-top:20px;min-height:76px}
button:focus-visible{outline:4px solid #ff9f1c;outline-offset:3px}
.langbar{display:flex;justify-content:flex-end;gap:6px}
.langbar button{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--card);border:0;border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 var(--edge);transition:transform .1s,box-shadow .1s}
.langbar button[aria-pressed="true"]{background:var(--sun);color:#3a2a6e;box-shadow:0 4px 0 #d98e00}
.langbar button:active{transform:translateY(3px)}
.foot{margin-top:36px;text-align:center;font-weight:700;font-size:20px;letter-spacing:1px;color:var(--ink);text-shadow:0 2px 0 var(--edge)}
/* result */
.result{text-align:center;padding-top:30px}
.trophy{font-size:clamp(90px,24vw,150px);animation:float 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 6px rgba(60,30,90,.3))}
.result h2{font-size:clamp(34px,8vw,58px);margin:0 0 6px;color:#ff5a5f;text-shadow:0 3px 0 #c22d44,0 8px 12px rgba(40,10,60,.3)}
.stars{font-size:clamp(26px,6vw,40px);margin:10px 0 24px;font-weight:700}
.conf{position:fixed;top:-90px;width:44px;height:44px;pointer-events:none;animation:fall linear forwards;z-index:5}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<svg class="s" aria-hidden="true" focusable="false"><defs>
<radialGradient id="gRed" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff9a9a"/><stop offset="1" stop-color="#d91f2a"/></radialGradient>
<radialGradient id="gStraw" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#ff8396"/><stop offset="1" stop-color="#d11a3c"/></radialGradient>
<radialGradient id="gOrange" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#f2740a"/></radialGradient>
<linearGradient id="gMango" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset=".6" stop-color="#ffa21f"/><stop offset="1" stop-color="#f2585a"/></linearGradient>
<radialGradient id="gBlue" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#8d9cff"/><stop offset="1" stop-color="#27348f"/></radialGradient>
<linearGradient id="gBan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#ffc41f"/></linearGradient>
<symbol id="apple" viewBox="0 0 64 64"><path d="M32 18C24 12 10 16 10 34c0 14 9 26 16 26 3 0 4-1 6-1s3 1 6 1c7 0 16-12 16-26 0-18-14-22-22-16z" fill="url(#gRed)"/><path d="M32 18c0-6 2-10 6-13" stroke="#6b3d1e" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M36 12c6-6 14-3 14-3s-2 8-10 8z" fill="#43b648"/><ellipse cx="20" cy="31" rx="4" ry="8" fill="#fff" opacity=".45" transform="rotate(20 20 31)"/></symbol>
<symbol id="strawberry" viewBox="0 0 64 64"><path d="M32 60C16 50 6 36 11 25c4-8 14-8 21-5 7-3 17-3 21 5 5 11-5 25-21 35z" fill="url(#gStraw)"/><path d="M32 22l-10-9 10 3 10-3z" fill="#3fae49"/><rect x="30" y="8" width="4" height="9" rx="2" fill="#3fae49"/><g fill="#ffe27a"><ellipse cx="22" cy="31" rx="1.8" ry="2.6"/><ellipse cx="32" cy="29" rx="1.8" ry="2.6"/><ellipse cx="42" cy="31" rx="1.8" ry="2.6"/><ellipse cx="27" cy="41" rx="1.8" ry="2.6"/><ellipse cx="37" cy="41" rx="1.8" ry="2.6"/><ellipse cx="32" cy="50" rx="1.8" ry="2.6"/></g><ellipse cx="19" cy="30" rx="3" ry="6" fill="#fff" opacity=".35" transform="rotate(20 19 30)"/></symbol>
<symbol id="watermelon" viewBox="0 0 64 64"><path d="M4 18h56a28 28 0 0 1-56 0z" fill="#2e9e4a"/><path d="M7 18h50a25 25 0 0 1-50 0z" fill="#d9f2c4"/><path d="M10 18h44a22 22 0 0 1-44 0z" fill="#ff4d6d"/><g fill="#3a1d2b"><ellipse cx="22" cy="28" rx="2" ry="3.2"/><ellipse cx="32" cy="32" rx="2" ry="3.2"/><ellipse cx="42" cy="28" rx="2" ry="3.2"/><ellipse cx="27" cy="38" rx="2" ry="3.2"/><ellipse cx="37" cy="38" rx="2" ry="3.2"/></g><path d="M12 21h40" stroke="#fff" stroke-width="2" opacity=".35" stroke-linecap="round"/></symbol>
<symbol id="orange" viewBox="0 0 64 64"><circle cx="32" cy="36" r="25" fill="url(#gOrange)"/><path d="M33 12c2-6 8-8 13-6-1 6-6 9-13 6z" fill="#3fae49"/><circle cx="32" cy="12" r="2.5" fill="#6b3d1e"/><ellipse cx="21" cy="27" rx="5" ry="8" fill="#fff" opacity=".4" transform="rotate(30 21 27)"/><g fill="#d65f00" opacity=".35"><circle cx="38" cy="40" r="1.2"/><circle cx="28" cy="48" r="1.2"/><circle cx="45" cy="30" r="1.2"/><circle cx="34" cy="30" r="1.2"/></g></symbol>
<symbol id="mango" viewBox="0 0 64 64"><path d="M46 10C24 4 6 24 11 46c3 13 21 15 35 5 13-9 15-36 0-41z" fill="url(#gMango)"/><path d="M40 10c3-6 10-8 16-5-2 6-9 9-16 5z" fill="#3fae49"/><ellipse cx="22" cy="28" rx="4" ry="9" fill="#fff" opacity=".42" transform="rotate(25 22 28)"/></symbol>
<symbol id="banana" viewBox="0 0 64 64"><path d="M16 10C10 36 26 56 54 50c4-1 4 6-1 8C20 66 0 42 8 12z" fill="url(#gBan)" stroke="#d99a00" stroke-width="3" stroke-linejoin="round"/><rect x="9" y="4" width="9" height="9" rx="2.5" fill="#6b4a1e" transform="rotate(-10 13 8)"/><path d="M15 18c-2 14 4 26 16 32" stroke="#fff" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/></symbol>
<symbol id="blueberry" viewBox="0 0 64 64"><circle cx="32" cy="35" r="25" fill="url(#gBlue)"/><path d="M32 17l5 6-3 4h-4l-3-4z" fill="#1a2370"/><circle cx="32" cy="25" r="2.6" fill="#6f7fe0"/><ellipse cx="21" cy="28" rx="4.5" ry="7" fill="#fff" opacity=".4" transform="rotate(25 21 28)"/></symbol>
</defs></svg>

<main class="wrap">
<div class="langbar" role="group" aria-label="Language"><button type="button" data-l="en">English</button><button type="button" data-l="id">Indonesia</button></div>
<section id="home" class="screen on hero">
  <div class="fruitrow" id="row"></div>
  <h1 id="title"></h1>
  <p class="sub pop" style="--d:1300ms" id="sub"></p>
  <button class="btn go pop" style="--d:1500ms" id="start"></button>
  <p class="hint pop" style="--d:1700ms" id="hint"></p>
</section>

<section id="game" class="screen">
  <div class="top"><span class="chip" id="qnum"></span><button type="button" class="chip rf" id="rf">🔄 </button><span class="chip">⭐ <span id="stars">0</span></span></div>
  <div class="dots" id="dots"></div>
  <div class="card" id="card">
    <div class="eq" id="eq"></div>
    <div class="sum" id="sum"></div>
    <div class="msg" id="msg"></div>
    <div class="pad" id="pad"></div>
    <div class="next" id="next"></div>
  </div>
</section>

<section id="end" class="screen result">
  <div class="trophy">🏆</div>
  <h2 id="rank"></h2>
  <div class="stars" id="final"></div>
  <p class="sub" id="note"></p>
  <button class="btn go" id="again" style="margin:8px"></button> <button class="btn" id="fresh" style="margin:8px"></button>
</section>
<footer class="foot">created by 296Studios</footer>
</main>

<script>
const F=['apple','strawberry','watermelon','orange','mango','banana','blueberry'];
// Question bank: 1,000 fixed questions [a, b, fruitA, fruitB], same bank on every visit
const BANK=(()=>{let s=296;const r=()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const all=[];for(let a=1;a<=9;a++)for(let b=1;b<=10-a;b++)F.forEach(x=>F.forEach(y=>all.push([a,b,x,y])));
for(let k=all.length-1;k>0;k--){const j=Math.floor(r()*(k+1));[all[k],all[j]]=[all[j],all[k]]}
return all.slice(0,1000)})();
let Q=[];
const KEY='faa-used';let used=new Set();
try{used=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...used]))}catch(e){}};
const $=s=>document.querySelector(s);
const svg=t=>`<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#${t}"/></svg>`;
// Languages: English and Indonesian
const L={
en:{title:'Fruit Addition Adventure',words:['Fruit','Addition','Adventure'],sub:'Count the fruit, solve the sums, and become a Maths Master!',start:'Let’s play!',hint:'Every round has 10 questions from a bank of 1,000. Tap the fruit to count them, then tap the answer.',rf:'New questions',same:'Same questions',q:n=>`Question ${n} of 10`,ask:'Count all the fruit. How many are there?',cnt:'Count a ',ok:['Wow, perfect! ','Great job! ','You got it! '],big:'Too big! Tap the fruit and count again.',near:'Almost! Tap each fruit and count again.',nx:'Next question',prize:'See my prize',ranks:[['Maths Master!','You solved every sum like a champion.'],['Fruit Wizard!','So close to Maths Master. Play again for more stars!'],['Brave Counter!','Great effort. Count carefully and try again for more stars!']],fin:s=>`⭐ ${s} out of 30 stars`,names:{apple:'apple',strawberry:'strawberry',watermelon:'watermelon',orange:'orange',mango:'mango',banana:'banana',blueberry:'blueberry'}},
id:{title:'Petualangan Penjumlahan Buah',words:['Petualangan','Penjumlahan','Buah'],sub:'Hitung buahnya, kerjakan soalnya, dan jadilah Jagoan Matematika!',start:'Ayo main!',hint:'Setiap ronde ada 10 soal. Ketuk buahnya untuk menghitung, lalu ketuk jawabannya.',rf:'Soal baru',same:'Soal yang sama',q:n=>`Soal ${n} dari 10`,ask:'Hitung semua buahnya. Ada berapa?',cnt:'Hitung ',ok:['Wow, sempurna! ','Kerja bagus! ','Kamu berhasil! '],big:'Terlalu besar! Ketuk buahnya dan hitung lagi.',near:'Hampir! Ketuk tiap buah dan hitung lagi.',nx:'Soal berikutnya',prize:'Lihat hadiahku',ranks:[['Jagoan Matematika!','Kamu menyelesaikan semua soal seperti juara.'],['Penyihir Buah!','Hampir jadi Jagoan Matematika. Main lagi untuk dapat lebih banyak bintang!'],['Penghitung Berani!','Usaha yang hebat. Hitung dengan teliti dan coba lagi untuk dapat lebih banyak bintang!']],fin:s=>`⭐ ${s} dari 30 bintang`,names:{apple:'apel',strawberry:'stroberi',watermelon:'semangka',orange:'jeruk',mango:'mangga',banana:'pisang',blueberry:'blueberry'}}
};
let lang='en';
try{lang=localStorage.getItem('faa-lang')||((navigator.language||'').startsWith('id')?'id':'en')}catch(e){}
const tx=()=>L[lang];
let lastMsg=()=>tx().ask,rk=0;
function setMsg(f){lastMsg=f;$('#msg').textContent=f()}
function fillEnd(){const r=tx().ranks[rk];$('#note').textContent=r[1];$('#rank').textContent=r[0];$('#final').textContent=tx().fin(stars)}
function applyLang(){
  const T=tx();let d=0;
  document.documentElement.lang=lang;document.title=T.title;
  const h=$('#title');h.setAttribute('aria-label',T.title);
  h.innerHTML=T.words.map(w=>'<span class="w">'+[...w].map(c=>`<span class="l" style="--d:${300+(d++)*45}ms">${c}</span>`).join('')+'</span>').join('');
  $('#sub').textContent=T.sub;$('#start').textContent=T.start;$('#hint').textContent=T.hint;
  $('#rf').textContent='🔄 '+T.rf;$('#again').textContent=T.same;$('#fresh').textContent=T.rf;
  document.querySelectorAll('.langbar button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  if(i<10){
    $('#qnum').textContent=T.q(i+1);$('#msg').textContent=lastMsg();
    const nx=$('#nx');if(nx)nx.textContent=i<9?T.nx:T.prize;
    document.querySelectorAll('.fruit').forEach(f=>f.setAttribute('aria-label',T.cnt+T.names[f.dataset.t]));
  }
  fillEnd();
}
let i=0,stars=0,tries=0,done=false,cnt=0;

// hero
$('#row').innerHTML=F.map((t,k)=>`<span class="pop" style="--d:${k*110}ms">${svg(t).replace('<svg','<svg style="--d:'+(k*300)+'ms"')}</span>`).join('');


function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function fruits(n,t,off){return Array.from({length:n},(_,k)=>`<button class="fruit" style="--d:${off+k*70}ms" data-t="${t}" aria-label="${tx().cnt}${tx().names[t]}">${svg(t)}<b class="badge"></b></button>`).join('')}

function dots(){$('#dots').innerHTML=Q.map((_,k)=>`<i class="${k<i?'done':k===i?'cur':''}"></i>`).join('')}

function render(){
  const [a,b,ta,tb]=Q[i];tries=0;done=false;cnt=0;
  $('#qnum').textContent=tx().q(i+1);
  $('#stars').textContent=stars;dots();
  $('#eq').innerHTML=`<div class="grp">${fruits(a,ta,0)}</div><div class="op pop" style="--d:300ms">+</div><div class="grp">${fruits(b,tb,a*70+300)}</div><div class="op pop" style="--d:600ms">=</div><div class="ans pop" id="ans" style="--d:700ms">?</div>`;
  $('#sum').textContent=`${a} + ${b} = ?`;
  setMsg(()=>tx().ask);
  $('#next').innerHTML='';
  $('#pad').innerHTML=Array.from({length:10},(_,k)=>`<button data-n="${k+1}" style="--h:${(k*36+8)%360};--d:${k*40+200}ms">${k+1}</button>`).join('');
  const c=$('#card');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');
}

// tap fruit to count
$('#eq').addEventListener('click',e=>{
  const f=e.target.closest('.fruit');if(!f||f.classList.contains('cnt'))return;
  f.classList.add('cnt');f.querySelector('.badge').textContent=++cnt;
});

$('#pad').addEventListener('click',e=>{
  const bt=e.target.closest('button');if(!bt||done)return;
  const n=+bt.dataset.n,[a,b]=Q[i],ans=$('#ans');
  tries++;ans.className='ans';void ans.offsetWidth;ans.textContent=n;
  if(n===a+b){
    done=true;ans.classList.add('ok');
    const e=tries===1?3:tries===2?2:1;stars+=e;$('#stars').textContent=stars;
    {const ti=tries>2?2:tries-1;setMsg(()=>tx().ok[ti]+'+'+e+' ⭐'.repeat(e))}
    document.querySelectorAll('.fruit').forEach((f,k)=>{f.classList.add('hop');f.style.setProperty('--d',k*50+'ms')});
    $('#pad').querySelectorAll('button').forEach(x=>x.disabled=true);
    $('#next').innerHTML=`<button class="btn go pop" id="nx">${i<9?tx().nx:tx().prize}</button>`;
    document.querySelector('.dots i.cur').classList.add('done');
  }else{
    ans.classList.add('bad');bt.disabled=true;
    {const big=n>a+b;setMsg(()=>big?tx().big:tx().near)}
    setTimeout(()=>{if(!done){ans.className='ans';ans.textContent='?'}},800);
  }
});

$('#next').addEventListener('click',e=>{
  if(!e.target.closest('#nx'))return;
  if(i<9){i++;render()}else finish();
});

function finish(){
  i=10;show('end');
  rk=stars>=26?0:stars>=18?1:2;
  fillEnd();
  
  for(let k=0;k<26;k++){
    const c=document.createElement('div');c.className='conf';
    c.innerHTML=svg(F[k%7]);c.style.left=Math.random()*96+'%';
    c.style.animationDuration=(3+Math.random()*3)+'s';c.style.animationDelay=Math.random()*1.5+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),8000);
  }
}

// Draw 10 questions not yet used; when the bank runs out, start a fresh cycle
function newRound(){
  let pool=BANK.map((_,k)=>k).filter(k=>!used.has(k));
  if(pool.length<10){used.clear();pool=BANK.map((_,k)=>k)}
  for(let k=pool.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[pool[k],pool[j]]=[pool[j],pool[k]]}
  const pick=pool.slice(0,10);pick.forEach(k=>used.add(k));save();
  Q=pick.map(k=>BANK[k]).sort((p,q)=>p[0]+p[1]-q[0]-q[1]);
  i=0;stars=0;show('game');render();
}
$('#start').onclick=newRound;
$('#fresh').onclick=newRound;
$('#rf').onclick=newRound;
$('#again').onclick=()=>{i=0;stars=0;show('game');render()};
document.querySelector('.langbar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  lang=b.dataset.l;try{localStorage.setItem('faa-lang',lang)}catch(_){}
  applyLang();
});
applyLang();
</script>
<script src="kids-nav.js" defer></script>
