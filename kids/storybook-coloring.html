<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storybook Coloring</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe9f3;--bg2:#dff3ff;--ink:#4a2f7a;--card:#fff;--sh:#4a2f7a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b2050;--bg2:#12304a;--ink:#fff1fa;--card:#3b2f66;--sh:#0008}}
:root[data-theme="dark"]{--bg1:#2b2050;--bg2:#12304a;--ink:#fff1fa;--card:#3b2f66;--sh:#0008}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:#ffe9f3;overflow-x:hidden}
h1{margin:14px 12px 4px;text-align:center;font-size:clamp(1.5rem,5vw,2.4rem);text-shadow:0 3px 0 #fff8,0 6px 10px var(--sh);animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
.sub{text-align:center;margin:0 0 10px;opacity:.8;animation:drop .8s .15s both}
main{max-width:560px;margin:0 auto;padding:0 12px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.paper{width:100%;max-width:480px;aspect-ratio:1;background:#fff;border-radius:30px;padding:10px;box-shadow:0 0 0 8px #fff,0 0 0 13px #ff9ec4,0 28px 38px -14px var(--sh);transform:perspective(900px) rotateX(4deg);animation:rise .9s .25s cubic-bezier(.2,1.3,.4,1) both}
svg{width:100%;height:100%;display:block;touch-action:manipulation}
.f{fill:#fff;stroke:#222;stroke-width:2.2;stroke-linejoin:round;cursor:pointer;transform-box:fill-box;transform-origin:center}
.f:hover{filter:brightness(.96)}
.l{fill:none;stroke:#222;stroke-width:2;stroke-linecap:round;pointer-events:none}
.d{fill:#222;pointer-events:none}
.pop{animation:pop .35s}
.tools{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:480px;animation:rise .8s .45s both}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;background-image:radial-gradient(circle at 30% 28%,#fff9,#0000 55%);box-shadow:0 5px 0 #0003,0 8px 10px var(--sh);transition:transform .15s}
.sw:hover{transform:translateY(-3px)}
.sw.on{transform:translateY(-5px) scale(1.18);outline:4px solid var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;animation:rise .8s .55s both}
.btn{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:16px;color:#fff;background:#7b5cff;cursor:pointer;box-shadow:0 6px 0 #4b33b8,0 10px 14px var(--sh);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #4b33b8}
.btn.b2{background:#ff6b9d;box-shadow:0 6px 0 #c23b6c,0 10px 14px var(--sh)}
.btn.b3{background:#2ec4b6;box-shadow:0 6px 0 #1a8a80,0 10px 14px var(--sh)}
.shelf{display:flex;gap:16px;overflow-x:auto;width:100%;padding:14px 10px 22px;justify-content:safe center;perspective:800px}
.book{flex:0 0 112px;height:150px;border:0;border-radius:6px 14px 14px 6px;color:#fff;font:inherit;font-weight:700;font-size:.78rem;line-height:1.1;padding:10px 8px 8px 16px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transform:rotateY(-24deg);transform-origin:left;transition:transform .3s,box-shadow .3s;box-shadow:-6px 8px 0 #0002,8px 14px 20px var(--sh);border-left:10px solid #0003;animation:rise .7s both}
.book i{font-style:normal;font-size:2.3rem;text-align:center}
.book:hover,.book.on{transform:rotateY(0) translateY(-8px) scale(1.06)}
.book.on{outline:4px solid #fff}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.92)}}
#intro{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,var(--bg1),var(--bg2));background-color:#ffe9f3;transition:opacity .6s,transform .6s;overflow:hidden}
#intro.out{opacity:0;transform:scale(1.15);pointer-events:none}
#intro h2{font-size:clamp(2rem,9vw,3.6rem);margin:8px 0;text-shadow:0 4px 0 #fff9,0 10px 18px var(--sh);animation:drop .9s cubic-bezier(.2,1.4,.4,1) both}
#intro p{max-width:420px;margin:6px 0;animation:rise .8s .3s both}
.hero{font-size:5rem;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 12px 8px var(--sh))}
.steps{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.steps span{background:var(--card);padding:8px 14px;border-radius:14px;box-shadow:0 5px 0 #0002,0 8px 12px var(--sh);animation:rise .7s both}
.go{font-size:1.4rem;padding:14px 34px;animation:rise .8s .9s both,bob 2s 1.7s ease-in-out infinite}
.fl{position:absolute;font-size:2.2rem;animation:bob 4s ease-in-out infinite}
.nav{display:flex;align-items:center;gap:10px;animation:rise .8s .5s both}
#pn{font-weight:600;min-width:150px;text-align:center}
footer{text-align:center;padding:10px 12px 22px;font-weight:600;opacity:.85}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes drop{from{opacity:0;transform:translateY(-30px)}}
@keyframes pop{50%{transform:scale(1.08)}}
</style>
</head>
