<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tebak Suara Hewan - Game Ingatan Balita</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka untuk tampilan ceria khas anak-anak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti untuk Efek Kemenangan -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Card Flip Animation */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            transform: rotateY(180deg);
            border: 4px solid #f59e0b;
        }

        .card-back {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: 4px solid #60a5fa;
            cursor: pointer;
        }

        /* Bounce Pulse Animation for matched state */
        @keyframes matchedPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .matched-anim {
            animation: matchedPulse 0.5s ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-indigo-100 to-emerald-200 min-h-screen flex flex-col justify-between items-center p-3 sm:p-6 overflow-x-hidden">

    <!-- Header UI -->
    <header class="text-center my-2 max-w-xl w-full">
        <h1 class="text-3xl sm:text-5xl font-extrabold text-amber-500 drop-shadow-[0_3px_3px_rgba(0,0,0,0.3)] tracking-wide mb-1">
            🐾 Mainan Hewan 🐾
        </h1>
        <p class="text-slate-700 text-sm sm:text-lg font-semibold bg-white/70 backdrop-blur-md rounded-full py-1 px-4 inline-block shadow-sm">
            Cocokkan kartu & dengarkan suaranya! 🐶🐱
        </p>
    </header>

    <!-- Top Info Bar (Skor & Tombol Ulang) -->
    <div class="flex justify-between items-center w-full max-w-md bg-white/80 backdrop-blur-md p-3 px-5 rounded-2xl shadow-md my-2 border-2 border-white">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">⭐</span>
            <span class="text-gray-700 font-bold text-lg sm:text-xl">Cocok: <span id="match-count" class="text-emerald-600 font-extrabold">0</span> / 6</span>
        </div>
        <button id="reset-btn" onclick="resetGame()" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold py-2 px-4 rounded-xl shadow-md transition duration-200 flex items-center space-x-2 text-sm sm:text-base border-b-4 border-amber-600">
            <i class="fas fa-rotate-right"></i>
            <span>Ulang</span>
        </button>
    </div>

    <!-- Grid Kartu Permainan (Ukuran 3x4 = 12 Kartu) -->
    <main class="w-full max-w-md my-auto px-2">
        <div id="game-grid" class="grid grid-cols-3 sm:grid-cols-3 gap-3 sm:gap-4 aspect-[3/4] w-full">
            <!-- Kartu-kartu di-render dinamis oleh JavaScript -->
        </div>
    </main>

    <!-- Footer / Instruksi Singkat -->
    <footer class="mt-4 text-center text-xs sm:text-sm text-slate-600 font-medium">
        Dibuat ramah untuk anak balita 👶✨
    </footer>

    <!-- Pop-up Modal Kemenangan -->
    <div id="victory-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300 transform transition-all scale-90 opacity-0" id="modal-card">
            <div class="text-6xl sm:text-7xl mb-2 animate-bounce">🎉</div>
            <h2 class="text-3xl font-extrabold text-amber-500 mb-2">Hore! Hebat Sekali!</h2>
            <p class="text-gray-600 font-medium text-base sm:text-lg mb-6">
                Kamu berhasil menemukan semua pasangan hewan! 🥳🎈
            </p>
            <button onclick="resetGame()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-extrabold py-4 rounded-2xl shadow-lg border-b-4 border-green-700 active:scale-95 transition text-xl flex items-center justify-center space-x-2">
                <i class="fas fa-play"></i>
                <span>Main Lagi</span>
            </button>
        </div>
    </div>

    <script>
        // Data Hewan: Gambar (Emoji/SVG), Nama, Suara Teks, dan Efek Nada Synthesizer
        const ANIMALS = [
            { id: 'kucing', name: 'Kucing', emoji: '🐱', soundText: 'Meong meong!', pitch: 1.4 },
            { id: 'anjing', name: 'Anjing', emoji: '🐶', soundText: 'Guk guk guk!', pitch: 0.9 },
            { id: 'sapi', name: 'Sapi', emoji: '🐮', soundText: 'Mooo! Mooo!', pitch: 0.6 },
            { id: 'ayam', name: 'Ayam', emoji: '🐔', soundText: 'Petok petok!', pitch: 1.3 },
            { id: 'bebek', name: 'Bebek', emoji: '🦆', soundText: 'Kwek kwek kwek!', pitch: 1.2 },
            { id: 'singa', name: 'Singa', emoji: '🦁', soundText: 'Roar! Roar!', pitch: 0.5 }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isBoardLocked = false;

        const gridElement = document.getElementById('game-grid');
        const matchCountElement = document.getElementById('match-count');
        const victoryModal = document.getElementById('victory-modal');
        const modalCard = document.getElementById('modal-card');

        // Fungsi Membunyikan Suara Hewan menggunakan Web Speech API (Narasi Suara)
        function playAnimalSound(animal) {
            // Gunakan Web Speech API jika tersedia
            if ('speechSynthesis' in window) {
                // Hentikan suara sebelumnya jika ada
                window.speechSynthesis.cancel();

                // Ucapkan efek suara hewan terlebih dahulu
                const utterance = new SpeechSynthesisUtterance(`${animal.soundText} Ini ${animal.name}`);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                utterance.pitch = animal.pitch || 1.0;
                
                window.speechSynthesis.speak(utterance);
            }
        }

        // Inisialisasi & Acak Kartu
        function initGame() {
            gridElement.innerHTML = '';
            flippedCards = [];
            matchedPairs = 0;
            isBoardLocked = false;
            matchCountElement.textContent = matchedPairs;

            // Buat pasangan kartu (6 pasang = 12 kartu)
            let deck = [...ANIMALS, ...ANIMALS].map((animal, index) => ({
                ...animal,
                uniqueId: index
            }));

            // Acak urutan kartu (Fisher-Yates Shuffle)
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            cards = deck;

            // Render Kartu ke DOM
            deck.forEach((animal, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 w-full h-full cursor-pointer';
                cardEl.dataset.index = index;
                cardEl.dataset.id = animal.id;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">
                            <span class="text-3xl sm:text-4xl text-white/80">❓</span>
                        </div>
                        <div class="card-front">
                            <div class="flex flex-col items-center justify-center">
                                <span class="text-5xl sm:text-6xl drop-shadow-md select-none transform transition hover:scale-110">${animal.emoji}</span>
                                <span class="text-xs sm:text-sm font-bold text-amber-900 mt-1">${animal.name}</span>
                            </div>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl, animal));
                gridElement.appendChild(cardEl);
            });
        }

        // Logika Klik Kartu
        function handleCardClick(cardEl, animal) {
            // Abaikan jika papan dikunci, atau kartu yang sama diklik, atau kartu sudah terbuka
            if (isBoardLocked || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) {
                return;
            }

            // Memutar kartu
            cardEl.classList.add('flipped');
            playAnimalSound(animal);
            flippedCards.push({ cardEl, animal });

            // Jika dua kartu telah dibuka
            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        // Cek Apakah Dua Kartu Cocok
        function checkMatch() {
            isBoardLocked = true;
            const [first, second] = flippedCards;

            if (first.animal.id === second.animal.id) {
                // Kartu Cocok!
                setTimeout(() => {
                    first.cardEl.classList.add('matched', 'matched-anim');
                    second.cardEl.classList.add('matched', 'matched-anim');
                    
                    matchedPairs++;
                    matchCountElement.textContent = matchedPairs;
                    flippedCards = [];
                    isBoardLocked = false;

                    // Cek Kemenangan
                    if (matchedPairs === ANIMALS.length) {
                        setTimeout(showVictoryModal, 600);
                    }
                }, 400);
            } else {
                // Kartu Tidak Cocok - Tutup Kembali Dalam 1 Detik
                setTimeout(() => {
                    first.cardEl.classList.remove('flipped');
                    second.cardEl.classList.remove('flipped');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 1000);
            }
        }

        // Tampilkan Modal Kemenangan & Efek Konfeti
        function showVictoryModal() {
            victoryModal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-90', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Bunyi Ucapan Selamat
            if ('speechSynthesis' in window) {
                const winSpeech = new SpeechSynthesisUtterance('Hore! Selamat! Kamu berhasil mencocokkan semua hewan!');
                winSpeech.lang = 'id-ID';
                winSpeech.rate = 1.0;
                window.speechSynthesis.speak(winSpeech);
            }

            // Efek Konfeti Meriah
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        // Reset dan Mulai Ulang Permainan
        function resetGame() {
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-90', 'opacity-0');
            
            setTimeout(() => {
                victoryModal.classList.add('hidden');
                initGame();
            }, 200);
        }

        // Jalankan game saat halaman selesai dimuat
        window.onload = function() {
            initGame();
        };
    </script>
    <script src="kids-nav.js" defer></script>
</body>
</html>
