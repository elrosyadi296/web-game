<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hubungkan Titik Angka</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--ink:#3a2d86;--paper:#fffaf0;--edge:#dccfa9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
background:radial-gradient(circle at 10% 14%,#fff9 0 70px,#0000 72px),radial-gradient(circle at 88% 22%,#fff8 0 100px,#0000 102px),radial-gradient(circle at 78% 90%,#fff7 0 80px,#0000 82px),linear-gradient(160deg,#7cc8ff,#d9c8ff);background-attachment:fixed}
.app{max-width:1060px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));display:grid;gap:16px}
@media(min-width:900px){.app{grid-template-columns:minmax(0,1fr) 330px;align-items:start}header{grid-column:1/-1}}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(1.35rem,5vw,2.3rem);line-height:1.1;text-shadow:0 3px 0 #fff,0 7px 12px #3a2d8640}
.hr{display:flex;gap:8px;align-items:center}
.chip,.icon{font-family:'Baloo 2',cursive;font-weight:800;background:#fff;border:0;border-radius:99px;padding:.35rem .9rem;box-shadow:0 4px 0 #cfc3f5,0 8px 14px #3a2d8630;color:var(--ink);font-size:1rem}
.icon{width:46px;height:46px;padding:0;font-size:1.3rem;cursor:pointer}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 #cfc3f5}
.stage{position:relative;aspect-ratio:1;width:min(100%,max(260px,calc(100dvh - 170px)),680px);margin:0 auto;border-radius:30px;border:6px solid #fff;
background:radial-gradient(#e9dfc2 1.5px,#0000 2px) 0 0/22px 22px,var(--paper);box-shadow:0 10px 0 var(--edge),0 26px 40px #3a2d8644,inset 0 0 40px #f3e6c0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;border-radius:24px}
.panel{background:#ffffffd9;backdrop-filter:blur(8px);border:4px solid #fff;border-radius:28px;padding:18px;box-shadow:0 8px 0 #cfc3f5,0 20px 34px #3a2d8633;display:grid;gap:14px}
.who{display:flex;gap:14px;align-items:center}
.emo{font-size:3.2rem;width:78px;height:78px;display:grid;place-items:center;border-radius:24px;background:#fff4c9;box-shadow:inset 0 -6px 0 #ffe08a,0 5px 0 #f3cf62;flex:none}
.nm{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.6rem;line-height:1.1}
.lv{font-weight:800;font-size:.95rem}.no{font-size:.85rem;opacity:.7}
.bar{height:18px;border-radius:99px;background:#e5defc;box-shadow:inset 0 3px 5px #3a2d8630;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(#5eead4,#1fc8a0);box-shadow:inset 0 -4px 0 #0f9f80;transition:width .3s}
.msg{font-family:'Baloo 2',cursive;font-weight:600;font-size:1.2rem;min-height:2.6em;line-height:1.25}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
.btn{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.05rem;border:0;border-radius:18px;padding:.6rem .8rem;min-height:50px;color:#fff;background:var(--c);
box-shadow:0 6px 0 var(--d),0 12px 16px #0002;cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.btn:focus-visible,.icon:focus-visible,.tile:focus-visible{outline:4px solid #ffc83d;outline-offset:2px}
.wide{grid-column:1/-1}
.hot{animation:wob 1s ease-in-out infinite}
@keyframes wob{50%{transform:scale(1.06) rotate(-1.5deg)}}
.pop{animation:pop .7s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*.12s)}
@keyframes pop{0%{opacity:0;transform:translateY(30px) scale(.8) rotateX(25deg)}100%{opacity:1;transform:none}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
dialog{border:0;border-radius:28px;padding:16px;width:min(94vw,880px);max-height:88dvh;background:#fff;color:var(--ink);box-shadow:0 12px 0 #cfc3f5,0 30px 60px #0005;margin:auto}
dialog::backdrop{background:#3a2d8688;backdrop-filter:blur(4px)}
dialog[open]{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:sticky;top:0}
.gh h2{font-family:'Baloo 2',cursive;font-size:1.5rem}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{position:relative;border:0;border-radius:18px;background:#f6f2ff;padding:8px 4px 6px;cursor:pointer;font:700 .72rem 'Nunito',sans-serif;color:var(--ink);box-shadow:0 4px 0 #d8cff7}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile svg{width:100%;aspect-ratio:1;display:block}.tile span{display:block;margin-top:2px;line-height:1.15}
.tile.ok::after{content:'⭐';position:absolute;top:2px;right:4px;font-size:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="pop" style="--i:0">
    <h1>Hubungkan Titik Angka</h1>
    <div class="hr"><span class="chip" id="score">⭐ 0/100</span><button class="icon" id="snd" aria-label="Suara">🔊</button></div>
  </header>
  <main class="stage pop" style="--i:1" id="stage"><canvas id="cv" aria-label="Area permainan"></canvas></main>
  <aside class="panel pop" style="--i:2">
    <div class="who"><div class="emo" id="emo">⭐</div><div><div class="nm" id="nm"></div><div class="lv" id="lv"></div><div class="no" id="no"></div></div></div>
    <div class="bar"><i id="fill"></i></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="btns">
      <button class="btn wide" id="nextBtn" style="--c:#1fc8a0;--d:#0f9f80">Gambar Berikutnya ▶</button>
      <button class="btn" id="prev" style="--c:#8b7be8;--d:#5a47b8">◀ Sebelumnya</button>
      <button class="btn" id="again" style="--c:#ffb020;--d:#c47d00">🔄 Ulangi</button>
      <button class="btn" id="rnd" style="--c:#ff6b86;--d:#c93b58">🎲 Acak</button>
      <button class="btn" id="gal" style="--c:#4c8dff;--d:#2556c4">🖼️ Galeri</button>
    </div>
  </aside>
</div>
<dialog id="dlg"><div class="gh"><h2>Pilih Gambar</h2><button class="icon" id="cls" aria-label="Tutup">✖</button></div><div id="grid"></div></dialog>

<script>
const $=s=>document.querySelector(s),TAU=Math.PI*2;
const cv=$('#cv'),ctx=cv.getContext('2d'),stage=$('#stage');
const P=s=>s.split(' ').map(p=>p.split(',').map(Number));
const A=(i,n,o=0)=>-Math.PI/2+o+i*TAU/n,pol=(a,r)=>[50+r*Math.cos(a),50+r*Math.sin(a)];
const gen=(n,f)=>Array.from({length:n},(_,i)=>f(i));
const COL=['#ff8a65','#4fc3f7','#ffd54f','#81c784','#f48fb1','#b39ddb','#4dd0e1','#ffb74d','#a1e46d','#ff7597'];
function norm(p){const x=p.map(a=>a[0]),y=p.map(a=>a[1]),x0=Math.min(...x),x1=Math.max(...x),y0=Math.min(...y),y1=Math.max(...y),k=.74/Math.max(x1-x0,y1-y0);return p.map(([a,b])=>[.5+(a-(x0+x1)/2)*k,.5+(b-(y0+y1)/2)*k])}

/* ===== 100 GAMBAR ===== */
const S=[];
const add=(name,e,pts,open)=>S.push({name,e,pts:norm(pts),open:!!open,c:COL[S.length%COL.length]});
[['Rumah','🏠','50,14 84,44 74,44 74,84 58,84 58,60 42,60 42,84 26,84 26,44 16,44'],
['Mobil','🚗','10,64 10,50 24,46 36,30 64,30 76,46 90,50 90,64 80,64 76,72 66,72 62,64 38,64 34,72 24,72 20,64'],
['Ikan','🐟','10,50 28,32 50,26 72,36 82,48 94,32 94,68 82,52 72,64 50,74 28,68'],
['Perahu','⛵','50,12 74,56 52,56 88,62 76,84 24,84 12,62 48,56 26,56'],
['Pesawat','✈️','50,8 58,34 94,58 94,68 58,58 56,82 70,92 70,96 30,96 30,92 44,82 42,58 6,68 6,58 42,34'],
['Pohon','🌲','50,8 72,34 62,34 82,60 60,60 60,90 40,90 40,60 18,60 38,34 28,34'],
['Kupu-kupu','🦋','50,40 30,14 10,20 8,46 28,56 12,74 24,90 44,70 50,58 56,70 76,90 88,74 72,56 92,46 90,20 70,14'],
['Roket','🚀','50,6 64,26 64,62 78,78 78,92 60,82 40,82 22,92 22,78 36,62 36,26'],
['Mahkota','👑','12,76 8,28 32,52 50,20 68,52 92,28 88,76'],
['Gunung','⛰️','6,84 26,50 36,58 62,14 82,50 90,58 94,84'],
['Es Krim','🍦','50,94 28,52 22,46 20,34 26,20 38,10 62,10 74,20 80,34 78,46 72,52'],
['Payung','☂️','50,8 82,24 94,50 78,44 66,52 54,44 54,84 46,94 36,90 38,82 46,84 46,44 34,52 22,44 6,50 18,24'],
['Jam Pasir','⏳','22,8 78,8 78,22 56,50 78,78 78,92 22,92 22,78 44,50 22,22'],
['Panah','⬆️','50,6 84,40 64,40 64,94 36,94 36,40 16,40'],
['Petir','⚡','58,6 24,54 46,54 38,94 76,42 52,42']].forEach(h=>add(h[0],h[1],P(h[2])));
add('Hati','❤️',gen(18,i=>{const t=i*TAU/18;return[16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]}));
add('Tetesan Air','💧',gen(16,i=>{const t=i*TAU/16;return[36*Math.sin(t)*Math.sin(t/2),-40*Math.cos(t)]}));
{const c=[];for(let i=0;i<7;i++){const t=(50+i*260/6)*Math.PI/180;c.push([50+40*Math.cos(t),50+40*Math.sin(t)])}
for(let i=0;i<7;i++){const t=(300-i*240/6)*Math.PI/180;c.push([68+30*Math.cos(t),50+30*Math.sin(t)])}add('Bulan Sabit','🌙',c)}
add('Siput Spiral','🐌',gen(20,i=>[50+(4+i*2.1)*Math.cos(i*.55),50+(4+i*2.1)*Math.sin(i*.55)]),1);
add('Angka Delapan','♾️',gen(16,i=>{const t=(i+.25)*TAU/16,d=1+Math.sin(t)**2;return[45*Math.cos(t)/d,45*Math.sin(t)*Math.cos(t)/d]}));
add('Lingkaran','⚪',gen(16,i=>pol(A(i,16),45)));
add('Oval','🥚',gen(16,i=>[50+30*Math.cos(A(i,16)),50+45*Math.sin(A(i,16))]));
for(let n=3;n<=12;n++)add(n==3?'Segitiga':n==4?'Belah Ketupat':'Segi-'+n,'🔷',gen(n,i=>pol(A(i,n),45)));
const star=(n,k)=>gen(2*n,i=>pol(A(i,2*n),i%2?45*k:45));
for(let n=4;n<=12;n++)add('Bintang '+n+' Sudut','⭐',star(n,.45));
for(let n=5;n<=12;n++)add('Bintang Gemuk '+n,'🌟',star(n,.62));
for(let n=3;n<=8;n++)add('Bintang Tajam '+n,'✨',star(n,.3));
for(let n=6;n<=12;n++)add('Matahari '+n+' Sinar','🌞',star(n,.55));
for(const [d,nm] of [[.28,'Bunga'],[.18,'Bunga Mekar']])for(let n=3;n<=6;n++)add(nm+' '+n+' Kelopak','🌸',gen(4*n,i=>pol(A(i,4*n),45*(1-d+d*Math.cos(n*A(i,4*n)+n*Math.PI/2)))));
for(let n=4;n<=7;n++)add('Roda Gigi '+n,'⚙️',gen(4*n,i=>{const s=TAU/n,a=A(Math.floor(i/4),n),j=i%4;return pol(a+[0,.12,.38,.5][j]*s,j==1||j==2?45:34)}));
for(let n=3;n<=8;n++)add('Kincir '+n,'🎡',gen(2*n,i=>{const s=TAU/n,a=A(i>>1,n);return i%2?pol(a+.55*s,18):pol(a,45)}));
for(let n=3;n<=6;n++){const p=[[5,95]],w=90/n,h=85/n;for(let i=0;i<n;i++){p.push([5+i*w,95-(i+1)*h],[5+(i+1)*w,95-(i+1)*h])}p.push([95,95]);add('Tangga '+n+' Anak','🪜',p)}
for(const [t,nm] of [[30,'Plus Tebal'],[18,'Plus Tipis']]){const h=t/2;add(nm,'➕',[[50-h,5],[50+h,5],[50+h,50-h],[95,50-h],[95,50+h],[50+h,50+h],[50+h,95],[50-h,95],[50-h,50+h],[5,50+h],[5,50-h],[50-h,50-h]])}
for(let n=3;n<=12;n++)add(n==3?'Segitiga Terbalik':n==4?'Persegi':'Segi-'+n+' Putar','🔶',gen(n,i=>pol(A(i,n,Math.PI/n),45)));
for(let n=5;n<=8;n++)add('Bintang Bulat '+n,'💫',star(n,.74));

/* ===== STATE ===== */
let idx=0,nx=0,done=false,lt=1,fa=0,tm=0,snd=true,W=300,dpr=1,R=14,saved={};
try{saved=JSON.parse(localStorage.getItem('d2d')||'{}')}catch(e){}
const sh=()=>S[idx];
const say=t=>$('#msg').textContent=t;
const PRAISE=['Bagus sekali! 👏','Hebat! 🌟','Terus ya! 💪','Pintar! 😄','Kamu keren! 🎈','Sedikit lagi! 🚀'];
function upd(){const n=sh().pts.length;$('#fill').style.width=(done?100:nx/n*100)+'%';$('#score').textContent='⭐ '+Object.keys(saved).length+'/'+S.length}
function load(i){idx=(i+S.length)%S.length;nx=0;done=false;lt=1;fa=0;const s=sh(),n=s.pts.length;
$('#emo').textContent=s.e;$('#nm').textContent=s.name;$('#lv').textContent=n<=8?'🟢 Mudah':n<=16?'🟡 Sedang':'🔴 Sulit';
$('#no').textContent='Gambar '+(idx+1)+' dari '+S.length+' · '+n+' titik';R=Math.max(13,W*(n>20?.03:.037));
$('#nextBtn').classList.remove('hot');say('Tekan angka 1 untuk mulai!');upd()}

/* ===== SUARA ===== */
let ac;const tone=(f,d=.22,ty='sine',v=.22,w=0)=>{if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+w;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}};

/* ===== GAMBAR ===== */
function resize(){W=stage.clientWidth-12;dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=W*dpr;R=Math.max(13,W*(sh().pts.length>20?.03:.037))}
new ResizeObserver(resize).observe(stage);
const COLS={d:['#8ff5d6','#12a583'],n:['#ffb3c1','#ff3d6a'],p:['#b8abff','#6a55d9']};
function draw(){
tm+=.06;const s=sh(),p=s.pts.map(a=>[a[0]*W,a[1]*W]),n=p.length;
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,W);
if(lt<1)lt=Math.min(1,lt+.12);if(done&&fa<1)fa=Math.min(1,fa+.035);
if(done&&!s.open){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
ctx.globalAlpha=fa*.92;ctx.fillStyle=s.c;ctx.shadowColor='#3a2d8659';ctx.shadowBlur=W*.03;ctx.shadowOffsetY=W*.018;ctx.fill();ctx.shadowColor='transparent';ctx.globalAlpha=1}
if(!done&&nx>0){ctx.beginPath();ctx.setLineDash([W*.012,W*.018]);ctx.moveTo(p[nx-1][0],p[nx-1][1]);ctx.lineTo(p[nx][0],p[nx][1]);ctx.strokeStyle='#ff3d6a88';ctx.lineWidth=W*.008;ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])}
const L=p.slice(0,nx);if(done&&!s.open)L.push(p[0]);
if(L.length>1){ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(let i=1;i<L.length;i++){let q=L[i];if(i==L.length-1&&lt<1){const a=L[i-1];q=[a[0]+(q[0]-a[0])*lt,a[1]+(q[1]-a[1])*lt]}ctx.lineTo(q[0],q[1])}
ctx.strokeStyle='#5b3fd9';ctx.lineWidth=W*.014;ctx.lineCap=ctx.lineJoin='round';ctx.shadowColor='#3a2d8655';ctx.shadowBlur=6;ctx.shadowOffsetY=3;ctx.stroke();ctx.shadowColor='transparent'}
if(done){ctx.font=Math.round(W*.2*Math.min(1,fa*1.3))+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.e,W/2,W/2+Math.sin(tm*.7)*W*.01)}
p.forEach((q,i)=>{const nex=i==nx&&!done,c=COLS[i<nx||done?'d':nex?'n':'p'],r=nex?R*(1.12+.08*Math.sin(tm*2)):R;
if(nex){ctx.beginPath();ctx.arc(q[0],q[1],R*(1.6+.3*Math.sin(tm*2)),0,TAU);ctx.strokeStyle='#ff3d6a66';ctx.lineWidth=3;ctx.stroke()}
ctx.fillStyle='#3a2d8640';ctx.beginPath();ctx.ellipse(q[0],q[1]+r*.95,r*.9,r*.32,0,0,TAU);ctx.fill();
const g=ctx.createRadialGradient(q[0]-r*.35,q[1]-r*.4,r*.1,q[0],q[1],r);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);
ctx.beginPath();ctx.arc(q[0],q[1],r,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
ctx.fillStyle='#fff';ctx.font='800 '+Math.round(r*(i>8?.95:1.15))+'px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i+1,q[0],q[1]+r*.08)});
requestAnimationFrame(draw)}

/* ===== INTERAKSI ===== */
cv.addEventListener('pointerdown',e=>{if(done)return;
const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*W,pts=sh().pts,n=pts.length;
const d=pts.map(q=>Math.hypot(x-q[0]*W,y-q[1]*W)),m=d.indexOf(Math.min(...d));
if(m==nx&&d[m]<=Math.max(R*1.9,26)){tone(380+nx*35);nx++;lt=0;
if(nx>=n){done=true;fa=0;saved[idx]=1;try{localStorage.setItem('d2d',JSON.stringify(saved))}catch(e){}
say('Hore! Kamu berhasil membuat '+sh().name+'! 🎉');[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.25,i*.12));
if(window.confetti)confetti({particleCount:140,spread:80,origin:{y:.6}});$('#nextBtn').classList.add('hot')}
else say(nx%3==0?PRAISE[Math.floor(Math.random()*PRAISE.length)]:'Sekarang cari angka '+(nx+1)+'!');upd()}
else if(m!=nx&&d[m]<=R*1.4){tone(160,.25,'triangle',.3);stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake');say('Ups! Cari angka '+(nx+1)+' ya 🔎')}});

$('#nextBtn').onclick=()=>load(idx+1);$('#prev').onclick=()=>load(idx-1);$('#again').onclick=()=>load(idx);
$('#rnd').onclick=()=>{let i;do{i=Math.floor(Math.random()*S.length)}while(i==idx);load(i)};
$('#snd').onclick=function(){snd=!snd;this.textContent=snd?'🔊':'🔇'};
$('#gal').onclick=()=>{$('#grid').innerHTML=S.map((s,i)=>'<button class="tile'+(saved[i]?' ok':'')+'" data-i="'+i+'" aria-label="'+s.name+'"><svg viewBox="0 0 100 100"><'+(s.open?'polyline':'polygon')+' points="'+s.pts.map(a=>(a[0]*100).toFixed(1)+','+(a[1]*100).toFixed(1)).join(' ')+'" fill="'+(s.open?'none':s.c)+'" stroke="#5b3fd9" stroke-width="3" stroke-linejoin="round"/></svg><span>'+(i+1)+'. '+s.name+'</span></button>').join('');$('#dlg').showModal()};
$('#grid').onclick=e=>{const b=e.target.closest('.tile');if(b){load(+b.dataset.i);$('#dlg').close()}};
$('#cls').onclick=()=>$('#dlg').close();
addEventListener('keydown',e=>{if(e.key=='ArrowRight')load(idx+1);if(e.key=='ArrowLeft')load(idx-1)});
resize();load(0);draw();
</script>
<script src="kids-nav.js" defer></script>
</body>
</html>
